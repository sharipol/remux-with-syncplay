name: Build Remux fork image

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'VPS architecture (check with uname -m: x86_64 = amd64; aarch64 = arm64)'
        required: true
        type: choice
        options:
          - amd64
          - arm64

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jellyfin-web/package-lock.json
        # jellyfin-web is cloned later; do not turn on setup-node's cache until it exists.

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev clang cmake protobuf-compiler

      - name: Build fork's server
        run: |
          cargo build --release -p remux-server
          cp target/release/remux-server ./remux-server
          test -s remux-server

      - name: Install Dioxus CLI and build dashboard
        run: |
          cargo install dioxus-cli --version 0.7.10 --locked
          cd crates/remux-dashboard
          dx build --release

      - name: Stage dashboard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pages < <(find target crates/remux-dashboard/target -type f -path '*/public/index.html' -print 2>/dev/null || true)
          printf 'Dashboard entrypoint candidates:\n%s\n' "${pages[@]}"
          if [ "${#pages[@]}" -ne 1 ]; then
            echo 'Expected exactly one Dioxus public/index.html; inspect the dx output above.' >&2
            exit 1
          fi
          cp -a "$(dirname "${pages[0]}")" dashboard
          test -s dashboard/index.html

      - name: Build and stage Jellyfin Web
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v12.1 https://github.com/jellyfin/jellyfin-web.git jellyfin-web
          cd jellyfin-web
          npm install
          npm run build:production
          cd ..
          test -s jellyfin-web/dist/index.html
          mv jellyfin-web/dist jellyfin-web-built
          rm -rf jellyfin-web
          mv jellyfin-web-built jellyfin-web

      - name: Verify Dockerfile inputs
        run: |
          test -s remux-server
          test -s dashboard/index.html
          test -s jellyfin-web/index.html

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/${{ inputs.architecture }}
          tags: ghcr.io/${{ github.repository }}:latest-${{ inputs.architecture }}
